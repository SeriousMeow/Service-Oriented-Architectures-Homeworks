[pytest]
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
markers =
    req5: Transactional integrity / concurrency (section 5)
    req6: gRPC inter-service authentication (section 6)
    req7: Redis cache-aside/TTL/invalidation (section 7)
    req8: Booking -> Flight retry policy (section 8)
    req9: Redis HA Sentinel topology/config (section 9)
    req10: Circuit breaker (section 10)
