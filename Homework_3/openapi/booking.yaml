openapi: 3.0.3
info:
  title: Booking Service API
  version: 1.0.0
  description: REST API for flight search and booking management.
servers:
  - url: http://localhost:8000
paths:
  /flights:
    get:
      summary: Search flights
      parameters:
        - in: query
          name: origin
          required: true
          schema:
            $ref: "#/components/schemas/IataAirportCode"
          description: Origin airport IATA code
        - in: query
          name: destination
          required: true
          schema:
            $ref: "#/components/schemas/IataAirportCode"
          description: Destination airport IATA code
        - in: query
          name: date
          required: false
          schema:
            type: string
            format: date
          description: Optional departure date
      responses:
        200:
          description: Flights found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightListResponse"
        400:
          description: Invalid query params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        503:
          description: Flight service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flights/{id}:
    get:
      summary: Get flight by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        200:
          description: Flight details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flight"
        404:
          description: Flight not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        503:
          description: Flight service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings:
    post:
      summary: Create booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        201:
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: Flight not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        409:
          description: Not enough seats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        503:
          description: Flight service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        502:
          description: Upstream Flight Service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: List bookings by user
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: User bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"
        400:
          description: Invalid query params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}:
    get:
      summary: Get booking by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        200:
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        404:
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}/cancel:
    post:
      summary: Cancel booking
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        200:
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        404:
          description: Booking or reservation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        409:
          description: Booking cannot be cancelled in current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        503:
          description: Flight service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        502:
          description: Upstream Flight Service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    Id:
      type: string
      format: uuid

    IataAirportCode:
      type: string
      pattern: "^[A-Z]{3}$"
      description: Airport IATA code (3 uppercase letters)

    Timestamp:
      type: string
      format: date-time

    FlightStatus:
      type: string
      enum:
        - SCHEDULED
        - DEPARTED
        - CANCELLED
        - COMPLETED

    BookingStatus:
      type: string
      enum:
        - CONFIRMED
        - CANCELLED

    Flight:
      type: object
      required:
        - id
        - flight_number
        - airline
        - origin
        - destination
        - departure_time
        - arrival_time
        - total_seats
        - available_seats
        - price
        - status
      properties:
        id:
          $ref: "#/components/schemas/Id"
        flight_number:
          type: string
          example: SU1234
        airline:
          type: string
        origin:
          $ref: "#/components/schemas/IataAirportCode"
        destination:
          $ref: "#/components/schemas/IataAirportCode"
        departure_time:
          $ref: "#/components/schemas/Timestamp"
        arrival_time:
          $ref: "#/components/schemas/Timestamp"
        total_seats:
          type: integer
          minimum: 1
        available_seats:
          type: integer
          minimum: 0
        price:
          $ref: "#/components/schemas/Money"
        status:
          $ref: "#/components/schemas/FlightStatus"

    Money:
      type: object
      required:
        - currency
        - amount_minor
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: RUB
        amount_minor:
          type: integer
          minimum: 1
          description: Amount in minor units (kopecks/cents)

    Email:
      type: string
      format: email
      maxLength: 255

    Name:
      type: string
      minLength: 1
      maxLength: 120

    CreateBookingRequest:
      type: object
      required:
        - user_id
        - flight_id
        - passenger_name
        - passenger_email
        - seat_count
      properties:
        user_id:
          $ref: "#/components/schemas/Id"
        flight_id:
          $ref: "#/components/schemas/Id"
        passenger_name:
          $ref: "#/components/schemas/Name"
        passenger_email:
          $ref: "#/components/schemas/Email"
        seat_count:
          type: integer
          minimum: 1

    Booking:
      type: object
      required:
        - id
        - user_id
        - flight_id
        - passenger_name
        - passenger_email
        - seat_count
        - total_price
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Id"
        user_id:
          $ref: "#/components/schemas/Id"
        flight_id:
          $ref: "#/components/schemas/Id"
        passenger_name:
          $ref: "#/components/schemas/Name"
        passenger_email:
          $ref: "#/components/schemas/Email"
        seat_count:
          type: integer
          minimum: 1
        total_price:
          $ref: "#/components/schemas/Money"
        status:
          $ref: "#/components/schemas/BookingStatus"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    FlightListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Flight"

    BookingListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Booking"

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
