syntax = "proto3";

package flight.v1;

import "google/protobuf/timestamp.proto";

service FlightService {
  // Search flights by route and optional departure date.
  rpc SearchFlights(SearchFlightsRequest) returns (SearchFlightsResponse);

  // Get flight details by ID.
  // Errors: NOT_FOUND.
  rpc GetFlight(GetFlightRequest) returns (GetFlightResponse);

  // Idempotent seat reservation for a booking.
  // If booking_id is already reserved, returns existing reservation.
  // Errors: NOT_FOUND, RESOURCE_EXHAUSTED, FAILED_PRECONDITION.
  rpc ReserveSeats(ReserveSeatsRequest) returns (ReserveSeatsResponse);

  // Release active reservation and return seats to a flight.
  // Errors: NOT_FOUND, FAILED_PRECONDITION.
  rpc ReleaseReservation(ReleaseReservationRequest) returns (ReleaseReservationResponse);
}

enum FlightStatus {
  FLIGHT_STATUS_UNSPECIFIED = 0;
  FLIGHT_STATUS_SCHEDULED = 1;
  FLIGHT_STATUS_DEPARTED = 2;
  FLIGHT_STATUS_CANCELLED = 3;
  FLIGHT_STATUS_COMPLETED = 4;
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_ACTIVE = 1;
  RESERVATION_STATUS_RELEASED = 2;
  RESERVATION_STATUS_EXPIRED = 3;
}

message Flight {
  string id = 1;
  string flight_number = 2;
  string airline = 3;
  // IATA 3-letter airport code, e.g. "SVO", "VKO", "LED".
  string origin = 4;
  // IATA 3-letter airport code, e.g. "SVO", "VKO", "LED".
  string destination = 5;
  google.protobuf.Timestamp departure_time = 6;
  google.protobuf.Timestamp arrival_time = 7;
  uint32 total_seats = 8;
  uint32 available_seats = 9;
  // ISO 4217 currency code (3 letters), e.g. "USD", "EUR", "RUB".
  string price_currency = 10;
  // Price per seat in minor units (e.g. cents for USD/EUR; exponent depends on price_currency).
  uint64 price_minor_units = 11;
  FlightStatus status = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message SeatReservation {
  string id = 1;
  string booking_id = 2;
  string flight_id = 3;
  uint32 seat_count = 4;
  ReservationStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message SearchFlightsRequest {
  string origin = 1;
  string destination = 2;
  // Optional: if omitted, service returns future scheduled flights.
  google.protobuf.Timestamp departure_date = 3;
}

message SearchFlightsResponse {
  repeated Flight flights = 1;
}

message GetFlightRequest {
  string flight_id = 1;
}

message GetFlightResponse {
  Flight flight = 1;
}

message ReserveSeatsRequest {
  string booking_id = 1;
  string flight_id = 2;
  uint32 seat_count = 3;
}

message ReserveSeatsResponse {
  Flight flight = 1;
  SeatReservation reservation = 2;
}

message ReleaseReservationRequest {
  string booking_id = 1;
}

message ReleaseReservationResponse {
  Flight flight = 1;
  SeatReservation reservation = 2;
}
