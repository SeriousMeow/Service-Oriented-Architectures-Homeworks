services:
  toxiproxy:
    image: shopify/toxiproxy:2.1.4
    command: ["-host=0.0.0.0", "-port=8474"]
    expose:
      - "8474"
      - "8666"

  toxiproxy_init:
    image: curlimages/curl:8.12.1
    depends_on:
      toxiproxy:
        condition: service_started
    command:
      [
        "sh",
        "-c",
        # Create a proxy named 'flight' listening on :8666 and upstream to flight:50051.
        "set -eu; \
         until curl -sf http://toxiproxy:8474/proxies >/dev/null; do sleep 0.2; done; \
         code=\"$$(curl -sS -o /tmp/toxi_resp -w '%{http_code}' -X POST http://toxiproxy:8474/proxies \
           -H 'Content-Type: application/json' \
           -d '{\"name\":\"flight\",\"listen\":\"0.0.0.0:8666\",\"upstream\":\"flight:50051\"}')\"; \
         if [ \"$$code\" != \"201\" ] && [ \"$$code\" != \"409\" ]; then \
           echo \"toxiproxy init failed (http=$$code)\"; cat /tmp/toxi_resp; exit 1; \
         fi; \
         echo \"toxiproxy proxy flight configured (http=$$code)\";",
      ]

  api-tests:
    build:
      context: .
      dockerfile: ./tests/Dockerfile
    environment:
      BASE_URL: http://booking:8000
      GRPC_ADDR: flight:50051

      POSTGRES_FLIGHT_HOST: postgres_flight
      POSTGRES_FLIGHT_PORT: 5432
      POSTGRES_FLIGHT_USER: user
      POSTGRES_FLIGHT_PASSWORD: password
      POSTGRES_FLIGHT_DB: flight

      POSTGRES_BOOKING_HOST: postgres_booking
      POSTGRES_BOOKING_PORT: 5432
      POSTGRES_BOOKING_USER: user
      POSTGRES_BOOKING_PASSWORD: password
      POSTGRES_BOOKING_DB: booking

      REDIS_HOST: redis
      REDIS_PORT: 6379

      SERVICE_API_KEY: change-me

      ORIGIN: SVO
      DESTINATION: LED
      AIRLINE: TestAir
      FLIGHT_NUMBER: SU100
      DEPARTURE_TIME: 2026-03-20T10:00:00+00
      ARRIVAL_TIME: 2026-03-20T11:30:00+00
      TOTAL_SEATS: 100
      PRICE_CURRENCY: RUB
      PRICE_MINOR_UNITS: 500000
    depends_on:
      booking:
        condition: service_started
      flight:
        condition: service_started
      postgres_booking:
        condition: service_healthy
      postgres_flight:
        condition: service_healthy
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      toxiproxy_init:
        condition: service_completed_successfully

  booking:
    environment:
      # Route Booking -> Flight traffic through toxiproxy for deterministic failure injection tests.
      FLIGHT_SERVICE_ADDR: toxiproxy:8666
      # Keep breaker recovery fast so it doesn't poison unrelated tests.
      CIRCUIT_BREAKER_OPEN_TIMEOUT_MS: 300
    depends_on:
      toxiproxy_init:
        condition: service_completed_successfully
