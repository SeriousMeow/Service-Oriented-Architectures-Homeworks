services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace-api-gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
